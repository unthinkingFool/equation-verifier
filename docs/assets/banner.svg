<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Autograd Explorer</title>
  <desc id="d">Banner for Autograd Explorer: an interactive playground that visualises computational graphs and backpropagation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1218"/>
      <stop offset="1" stop-color="#171d27"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#ff7a33"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2e333c"/>
    </pattern>
    <marker id="fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#46a6ef"/>
    </marker>
    <marker id="bwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8244"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#2e333c"/>

  <!-- Title block -->
  <g font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="72" y="150" font-size="76" font-weight="800" fill="url(#brand)">∂</text>
    <text x="132" y="150" font-size="62" font-weight="800" fill="#ebe7e0" letter-spacing="-1">Autograd Explorer</text>
    <text x="74" y="204" font-size="27" fill="#9199a5">See backpropagation, step by step.</text>
  </g>

  <!-- Feature chips -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="15">
    <g transform="translate(74 244)">
      <rect width="176" height="36" rx="18" fill="#161b23" stroke="#2e333c"/>
      <circle cx="20" cy="18" r="5" fill="#46a6ef"/>
      <text x="36" y="23" fill="#ebe7e0">forward pass</text>
    </g>
    <g transform="translate(262 244)">
      <rect width="190" height="36" rx="18" fill="#161b23" stroke="#2e333c"/>
      <circle cx="20" cy="18" r="5" fill="#ff8244"/>
      <text x="36" y="23" fill="#ebe7e0">backward pass</text>
    </g>
    <g transform="translate(464 244)">
      <rect width="196" height="36" rx="18" fill="#161b23" stroke="#2e333c"/>
      <circle cx="20" cy="18" r="5" fill="#a689f1"/>
      <text x="36" y="23" fill="#ebe7e0">chain rule</text>
    </g>
  </g>

  <!-- Mini computational graph -->
  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace">
    <!-- forward edges -->
    <g fill="none" stroke="#46a6ef" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#fwd)">
      <path d="M868 112 C 900 112, 910 150, 942 150"/>
      <path d="M868 208 C 900 208, 910 170, 942 170"/>
      <path d="M1022 160 L 1060 160"/>
      <path d="M1150 160 L 1176 160"/>
    </g>
    <!-- backward edges -->
    <g fill="none" stroke="#ff8244" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#bwd)">
      <path d="M1198 196 C 1198 262, 1100 262, 1086 196"/>
      <path d="M1040 200 C 1040 264, 960 270, 920 238"/>
    </g>

    <!-- leaf nodes -->
    <g>
      <rect x="788" y="90" width="80" height="44" rx="9" fill="#161b23" stroke="#46a6ef" stroke-width="2"/>
      <text x="828" y="109" text-anchor="middle" font-size="13" fill="#ebe7e0" font-weight="700">x</text>
      <text x="828" y="126" text-anchor="middle" font-size="12" fill="#46a6ef">2.0</text>

      <rect x="788" y="186" width="80" height="44" rx="9" fill="#161b23" stroke="#a689f1" stroke-width="2"/>
      <text x="828" y="205" text-anchor="middle" font-size="13" fill="#ebe7e0" font-weight="700">w</text>
      <text x="828" y="222" text-anchor="middle" font-size="12" fill="#a689f1">0.5</text>
    </g>

    <!-- operation pills -->
    <g>
      <rect x="942" y="138" width="80" height="44" rx="22" fill="#0e1218" stroke="#3dbbae" stroke-width="2"/>
      <text x="982" y="167" text-anchor="middle" font-size="17" fill="#3dbbae" font-weight="700">×</text>

      <rect x="1060" y="138" width="90" height="44" rx="22" fill="#0e1218" stroke="#3dbbae" stroke-width="2"/>
      <text x="1105" y="166" text-anchor="middle" font-size="14" fill="#3dbbae" font-weight="700">relu</text>
    </g>

    <!-- output node -->
    <g>
      <rect x="1176" y="130" width="62" height="60" rx="10" fill="#161b23" stroke="#f5ae39" stroke-width="3"/>
      <text x="1207" y="154" text-anchor="middle" font-size="14" fill="#ebe7e0" font-weight="700">L</text>
      <text x="1207" y="172" text-anchor="middle" font-size="11" fill="#f5ae39">1.0</text>
    </g>

    <!-- gradient chips -->
    <g font-size="12" font-weight="700">
      <rect x="1124" y="270" width="96" height="26" rx="13" fill="#2a1a12" stroke="#ff8244"/>
      <text x="1172" y="287" text-anchor="middle" fill="#ff8244">∂L/∂L = 1</text>
      <rect x="868" y="258" width="104" height="26" rx="13" fill="#2a1a12" stroke="#ff8244"/>
      <text x="920" y="275" text-anchor="middle" fill="#ff8244">∂L/∂w = 2.0</text>
    </g>
  </g>
</svg>
